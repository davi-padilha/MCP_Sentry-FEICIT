[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentry-gateway"
version = "0.5.4"
description = "Local integrity gateway for MCP servers over stdio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mcp-sentry = "mcp_sentry_gateway.cli:main"
mcp-sentry-gateway = "mcp_sentry_gateway.gateway:main"
