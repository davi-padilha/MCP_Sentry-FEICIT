[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donna-mcp"
version = "0.1.0"
description = "Servidor MCP local Donna"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "codigo-fonte-do-mcp"}

[tool.setuptools.packages.find]
where = ["codigo-fonte-do-mcp"]
