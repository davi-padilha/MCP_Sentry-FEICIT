# Exemplo manual. Não substitui a configuração instalada automaticamente.
[mcp_servers.donna_mcp]
command = "C:\\CAMINHO_LOCAL\\venv\\Scripts\\python.exe"
args = ["C:\\CAMINHO\\MCP-Sentry\\aplicacoes\\donna_mcp\\entrypoints\\server_google.py"]
cwd = "C:\\CAMINHO\\MCP-Sentry\\aplicacoes\\donna_mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

[mcp_servers.donna_mcp.env]
MCP_SECRETARY_MODE = "live-google"
MCP_SECRETARY_TIMEZONE = "America/Sao_Paulo"
MCP_SECRETARY_CALENDAR_ID = "primary"
MCP_SECRETARY_CREDENTIALS_FILE = "C:\\DADOS_LOCAIS\\credentials.json"
MCP_SECRETARY_TOKEN_FILE = "C:\\DADOS_LOCAIS\\token.json"
MCP_SECRETARY_AUDIT_FILE = "C:\\DADOS_LOCAIS\\audit.jsonl"
MCP_SECRETARY_MUTATION_STORE_FILE = "C:\\DADOS_LOCAIS\\mutations.json"
